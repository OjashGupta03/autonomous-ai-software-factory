server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing (react-router) owns unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE calls to the backend service (compose network) so
    # the frontend can be served from a single origin in production.
    location /api/ {
        # Use Docker's internal DNS to dynamically resolve backend IP
        resolver 127.0.0.11 valid=5s;
        set $upstream_backend "http://backend:8000";
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # required so SSE events flush immediately
        proxy_read_timeout 3600s;     # long-lived SSE connections
    }
}
